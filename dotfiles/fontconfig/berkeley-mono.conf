<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Some faces lack the monospace flag -->
  <match target="scan">
    <test name="family" compare="eq"><string>Berkeley Mono</string></test>
    <edit name="spacing" mode="assign"><const>mono</const></edit>
  </match>
</fontconfig>
